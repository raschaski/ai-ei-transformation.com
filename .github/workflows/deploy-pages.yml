name: Webapp auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v6
      - name: pnpm vorbereiten
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - name: Node.js vorbereiten
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Pakete installieren
        run: pnpm install --frozen-lockfile
      - name: App testen
        run: pnpm test
      - name: App bauen
        run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5
      - name: Website hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
