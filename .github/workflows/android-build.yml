name: Android-App bauen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "capacitor.config.json"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: pnpm vorbereiten
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Node.js vorbereiten
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Java vorbereiten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK vorbereiten
        uses: android-actions/setup-android@v3

      - name: Android 16 SDK installieren
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Pakete installieren
        run: pnpm install --frozen-lockfile

      - name: Tests ausführen
        run: pnpm test

      - name: Webapp und Android-Projekt synchronisieren
        run: pnpm build:android
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Test-Bundle bauen
        working-directory: android
        run: ./gradlew bundleDebug

      - name: Upload-Schlüssel vorbereiten
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks

      - name: Signiertes Play-Store-Bundle bauen
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Test-Bundle speichern
        uses: actions/upload-artifact@v5
        with:
          name: mindful-ai-android-test
          path: android/app/build/outputs/bundle/debug/app-debug.aab

      - name: Play-Store-Bundle speichern
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: mindful-ai-play-store
          path: android/app/build/outputs/bundle/release/app-release.aab
